name: Backfill v4 releases
# One-off: creates GitHub Releases for Epic 4.0.0-4.0.5 on their existing tags,
# with the module files from the VASSAL Module Library and notes from release-notes/.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Publish 4.0.0 to 4.0.5
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          B=https://obj.vassalengine.org/gls
          while read -r ver path; do
            .github/scripts/publish-release.sh "$ver" "$B/$path/CCNapoEpic4.vmod" "v$ver"
          done <<'LIST'
          4.0.0 f/5
          4.0.1 f/4
          4.0.2 3/5
          4.0.3 a/5
          4.0.4 9/0
          4.0.5 6/6
          LIST
          gh release edit v4.0.5 --latest
